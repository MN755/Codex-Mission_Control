name: package-desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/desktop-packaging
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APPIMAGETOOL_VERSION: "1.9.0"
  APPIMAGETOOL_SHA256_X86_64: "46FDD785094C7F6E545B61AFCFB0F3D98D8EAB243F644B4B17698C01D06083D1"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025-vs2026
          - macos-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./apps/server[dev]" -e "./apps/desktop[dev]"

      - name: Install frontend dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Build frontend
        working-directory: apps/dashboard
        run: npm run build

      - name: Smoke-test editable installs
        shell: bash
        run: |
          python -c "import mission_control_desktop; import main"
          MISSION_CONTROL_DESKTOP_SMOKE_TEST=1 mission-control-desktop

      - name: Smoke-test built Python artifacts
        run: python scripts/smoke-packaged-python-artifacts.py

      - name: Run backend tests
        working-directory: apps/server
        run: python -m pytest

      - name: Install Linux AppImage tooling
        if: runner.os == 'Linux'
        run: |
          curl -L --fail "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" -o appimagetool
          echo "${APPIMAGETOOL_SHA256_X86_64}  appimagetool" | sha256sum --check --
          chmod +x appimagetool
          echo "APPIMAGETOOL=${GITHUB_WORKSPACE}/appimagetool" >> "$GITHUB_ENV"

      - name: Package desktop app
        run: python scripts/package-desktop.py

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codex-mission-control-${{ runner.os }}
          path: .runtime/packages/**
