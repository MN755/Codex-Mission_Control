[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mission-control-mcp-server"
version = "1.3.0b1"
description = "Local MCP bridge for Codex Mission Control"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1.0",
  "platformdirs>=4.3,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[project.scripts]
mission-control-mcp = "mission_control_mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mission_control_mcp_server._bundled" = [
  "*.json",
  "mcp/*.json",
  "templates/*.md",
  "commands/*.md",
  "agents/*.md",
  "assets/*",
  "skills/*/SKILL.md",
  "skills/*/agents/*.yaml",
  ".claude-plugin/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
