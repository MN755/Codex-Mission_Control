[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mission-control-server"
version = "1.3.0b1"
description = "Local orchestration backend for Codex Mission Control"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.11,<3.0",
  "httpx>=0.28,<1.0",
  "platformdirs>=4.3,<5.0",
  "pywebview>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "app_profile",
  "bridge_formatter",
  "bridge_messages",
  "chat_markdown",
  "claude_cli_path",
  "codex_auth",
  "codex_cli_path",
  "config",
  "daemon_state",
  "db",
  "device_profile",
  "diagnostic_formatter",
  "diagnostics",
  "event_digest_formatter",
  "events",
  "gpu_support",
  "handoff_formatter",
  "imported_codebase",
  "interview",
  "main",
  "manager",
  "mission_control_daemon",
  "models",
  "nvidia_support",
  "orchestration",
  "planner",
  "plugin_health",
  "project_settings",
  "prompts",
  "provider_adapter_recipes",
  "provider_support",
  "runtime_paths",
  "schemas",
  "startup",
  "subagent_planner",
  "swarm",
  "system_status",
  "task_board",
  "tool_catalog",
  "webwright_support",
  "widget_catalog",
  "workspace_tooling",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
