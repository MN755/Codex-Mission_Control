[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mission-control-desktop"
version = "1.3.0b1"
description = "Desktop shell for Codex Mission Control"
requires-python = ">=3.10"
dependencies = [
  "codex-mission-control-server==1.3.0b1",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "platformdirs>=4.3,<5.0",
  "pydantic>=2.11,<3.0",
  "pywebview>=5.0,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0,<7.0",
]

[project.scripts]
mission-control-desktop = "mission_control_desktop.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
